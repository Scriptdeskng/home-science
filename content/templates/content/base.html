{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="Home Recipe">
        <meta name="author" content="Home Recipe">
        <title>
            {% block page_title %}
            {% endblock page_title %}
            | Home Recipe
        </title>
        <!-- Favicon Icon -->
        <link rel="icon" type="image/png" href="img/favicon.png">
        <!-- Bootstrap core CSS-->
        <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}"
              rel="stylesheet">
        <!-- Custom fonts for this template-->
        <link href="{% static 'assets/vendor/fontawesome-free/css/all.min.css' %}"
              rel="stylesheet"
              type="text/css">
        <!-- Custom styles for this template-->
        <link href="{% static 'assets/css/osahan.css' %}" rel="stylesheet">
        <!-- Owl Carousel -->
        <link rel="stylesheet"
              href="{% static 'assets/vendor/owl-carousel/owl.carousel.css' %}">
        <link rel="stylesheet"
              href="{% static 'assets/vendor/owl-carousel/owl.theme.css' %}">
    </head>
    <body id="page-top">
        {% include 'partials/_header.html' %}
        <div id="wrapper">
            {% include 'partials/_sidebar.html' %}
            <div id="content-wrapper">
                <div class="container-fluid pb-0">
                    {% block content %}
                    {% endblock content %}
                </div>
                <!-- /.container-fluid -->
                <!-- Sticky Footer -->
                <footer class="sticky-footer">
                    <div class="container">
                        <div class="row no-gutters">
                            <div class="col-lg-6 col-sm-6">
                                <p class="mt-1 mb-0">
                                    &copy; Copyright <script>document.write(new Date().getFullYear())</script> <strong class="text-dark">Home Recipe</strong>. All Rights Reserved
                                    <br>
                                </p>
                            </div>
                            {% comment %} <div class="col-lg-6 col-sm-6 text-right">
                        <div class="app">
                           <a href="#"><img alt="" src="img/google.png"></a>
                           <a href="#"><img alt="" src="img/apple.png"></a>
                        </div>
                            </div> {% endcomment %}
                        </div>
                    </div>
                </footer>
                <!-- /.content-wrapper -->
            </div>
            <!-- /#wrapper -->
            <!-- Scroll to Top Button-->
            <a class="scroll-to-top rounded" href="#page-top">
                <i class="fas fa-angle-up"></i>
            </a>
            <!-- Bootstrap core JavaScript-->
            <script src="{% static 'assets/vendor/jquery/jquery.min.js' %}"></script>
            <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
            <!-- Core plugin JavaScript-->
            <script src="{% static 'assets/vendor/jquery-easing/jquery.easing.min.js' %}"></script>
            <!-- Owl Carousel -->
            <script src="{% static 'assets/vendor/owl-carousel/owl.carousel.js' %}"></script>
            <!-- Custom scripts for all pages-->
            <script src="{% static 'assets/js/custom.js' %}"></script>
        </body>
    </html>
